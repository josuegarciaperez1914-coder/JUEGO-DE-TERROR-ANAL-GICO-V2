name: Build NO MIRES ATRAS Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'NO_Mires_Atras_Android_Java_LibGDX.zip'
      - '.github/workflows/build-no-mires-atras-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Compile NO MIRES ATRAS (LibGDX)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project archive
        run: |
          test -f NO_Mires_Atras_Android_Java_LibGDX.zip
          unzip -t NO_Mires_Atras_Android_Java_LibGDX.zip
          mkdir -p workspace
          unzip -q NO_Mires_Atras_Android_Java_LibGDX.zip -d workspace
          echo "Archive contents:"
          find workspace -maxdepth 4 -type f | sort | head -200
          WRAPPER="$(find workspace -type f -name gradlew -print -quit)"
          if [ -z "$WRAPPER" ]; then
            echo "::error::No se encontró gradlew dentro del proyecto LibGDX."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$WRAPPER")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Gradle project: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Compile Android debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NO-MIRES-ATRAS-debug-APK
          path: workspace/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

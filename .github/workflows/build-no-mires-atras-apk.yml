name: Build NO MIRES ATRAS Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'NO_Mires_Atras_Android_Java_LibGDX.zip'
      - '.github/workflows/build-no-mires-atras-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Compile NO MIRES ATRAS (LibGDX)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project and locate Gradle root
        run: |
          test -f NO_Mires_Atras_Android_Java_LibGDX.zip
          unzip -t NO_Mires_Atras_Android_Java_LibGDX.zip
          mkdir -p workspace
          unzip -q NO_Mires_Atras_Android_Java_LibGDX.zip -d workspace
          SETTINGS_FILE="$(find workspace -type f -name settings.gradle -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::No se encontró settings.gradle en el proyecto."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyecto Gradle: $PROJECT_DIR"
          echo "Archivos Gradle:"
          find "$PROJECT_DIR" -maxdepth 3 -type f \( -name '*.gradle' -o -name 'gradle.properties' \) -print

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"

      - name: Correct LibGDX 3D imports
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          FILE="core/src/main/java/com/nomiresatras/game/NoMiresAtrasGame.java"
          test -f "$FILE"
          sed -i 's/import com.badlogic.gdx.graphics.g3d.utils.ModelBatch;/import com.badlogic.gdx.graphics.g3d.ModelBatch;/' "$FILE"
          if ! grep -q 'import com.badlogic.gdx.graphics.g3d.environment.DirectionalLight;' "$FILE"; then
            sed -i '/import com.badlogic.gdx.graphics.g3d.ModelBatch;/a import com.badlogic.gdx.graphics.g3d.environment.DirectionalLight;' "$FILE"
          fi
          grep -n 'ModelBatch\|DirectionalLight' "$FILE"
          # Include x86_64 native runtime so the same APK can be smoke-tested in Android Emulator.
          sed -i "/natives-arm64-v8a/a\\    implementation 'com.badlogicgames.gdx:gdx-platform:1.13.1:natives-x86_64'" android/build.gradle
          cat android/build.gradle

      - name: Inspect Android startup code and packaged assets
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== PROJECT FILES ==="
          find android core -type f | sort | head -200
          echo "=== ANDROID MANIFEST ==="
          while IFS= read -r f; do echo "--- $f"; sed -n '1,220p' "$f"; done < <(find android -name AndroidManifest.xml)
          echo "=== ANDROID LAUNCHER ==="
          while IFS= read -r f; do echo "--- $f"; sed -n '1,220p' "$f"; done < <(find android -type f -name '*Launcher*.java')
          echo "=== GAME ENTRY POINT ==="
          sed -n '1,320p' core/src/main/java/com/nomiresatras/game/NoMiresAtrasGame.java
          echo "=== ASSET FILES ==="
          find android/assets core/assets -type f -printf '%p %s bytes\n' 2>/dev/null || true
          echo "=== GRADLE CONFIG ==="
          for f in build.gradle android/build.gradle core/build.gradle gradle.properties; do
            if [ -f "$f" ]; then echo "--- $f"; sed -n '1,220p' "$f"; fi
          done

      - name: Compile Android debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --no-daemon assembleDebug

      - name: Smoke test app startup in Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          script: |
            APK="$(find . -path '*/build/outputs/apk/debug/*.apk' -print -quit)"
            test -n "$APK"
            adb install -r "$APK"
            adb shell am force-stop com.nomiresatras.android || true
            adb shell monkey -p com.nomiresatras.android 1
            sleep 20
            if ! adb shell pidof com.nomiresatras.android >/dev/null; then
              echo 'La app se cerró durante el arranque. Últimos registros:'
              adb logcat -d -t 2500
              exit 1
            fi
            echo 'OK: la app permaneció abierta durante 20 segundos.'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NO-MIRES-ATRAS-debug-APK
          path: workspace/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

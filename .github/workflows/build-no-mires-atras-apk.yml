name: Build NO MIRES ATRAS Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'NO_Mires_Atras_Android_Java_LibGDX.zip'
      - '.github/workflows/build-no-mires-atras-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Compile NO MIRES ATRAS (LibGDX)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project and locate Gradle root
        run: |
          test -f NO_Mires_Atras_Android_Java_LibGDX.zip
          unzip -t NO_Mires_Atras_Android_Java_LibGDX.zip
          mkdir -p workspace
          unzip -q NO_Mires_Atras_Android_Java_LibGDX.zip -d workspace
          PROJECT_DIR="$(find workspace -type f -name settings.gradle -printf '%h\\n' -quit)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::No se encontró settings.gradle en el proyecto."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyecto Gradle: $PROJECT_DIR"
          echo "Archivos Gradle:"
          find "$PROJECT_DIR" -maxdepth 3 -type f \( -name '*.gradle' -o -name 'gradle.properties' \) -print

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 7.6.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Compile Android debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NO-MIRES-ATRAS-debug-APK
          path: workspace/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

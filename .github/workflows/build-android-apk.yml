name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'SUENO_VHS_LISTO_PARA_APK.zip'

permissions:
  contents: read

jobs:
  build:
    name: Compile SUEÑO VHS APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract prepared game project
        run: |
          test -f SUENO_VHS_LISTO_PARA_APK.zip
          unzip -q SUENO_VHS_LISTO_PARA_APK.zip -d workspace
          test -f workspace/sueno_vhs_apk/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workspace/sueno_vhs_apk/package-lock.json

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        working-directory: workspace/sueno_vhs_apk
        run: npm ci

      - name: Install Capacitor Android
        working-directory: workspace/sueno_vhs_apk
        run: npm install --save-exact @capacitor/core@7 @capacitor/android@7 @capacitor/cli@7

      - name: Build game
        working-directory: workspace/sueno_vhs_apk
        run: npm run build

      - name: Generate Android project
        working-directory: workspace/sueno_vhs_apk
        run: npx cap add android

      - name: Sync web game to Android
        working-directory: workspace/sueno_vhs_apk
        run: npx cap sync android

      - name: Compile debug APK
        working-directory: workspace/sueno_vhs_apk/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SUENO-VHS-debug-APK
          path: workspace/sueno_vhs_apk/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
